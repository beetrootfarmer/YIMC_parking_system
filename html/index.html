<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>용인미디어센터 주차 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 🔗 [구글 Apps Script 배포 URL]
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"; // redacted — see .env.example

        // --- 유틸리티 함수 ---
        const formatTime = (timestamp) => {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        };

        const formatDate = (timestamp) => {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            return `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
        };

       const maskName = (name) => {
            if (!name) return "";
            const strName = String(name);
            if (strName.length <= 1) return strName;
            if (strName.length === 2) return strName[0] + "*";
            return strName[0] + "*".repeat(strName.length - 2) + strName[strName.length - 1];
        };

        const maskCarNumber = (carNum) => {
            if (!carNum) return "";
            const strCarNum = String(carNum);
            if (strCarNum.length < 4) return strCarNum;
            const last4 = strCarNum.slice(-4);
            return strCarNum.replace(last4, "**" + last4.slice(2));
        };

        // --- 오디오 시스템 ---
        let audioCtx = null;
        const playNotificationSound = () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.6);

                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {
                console.error("Audio play failed", e);
            }
        };

        // --- 토스트 컴포넌트 ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';

            return (
                <div className={`fixed top-5 left-1/2 transform -translate-x-1/2 ${bgColor} text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 animate-bounce`}>
                    <i className={`fas ${icon}`}></i>
                    <span className="font-semibold">{message}</span>
                </div>
            );
        };

        // --- 태블릿 뷰 컴포넌트 ---
        const TabletView = ({ requests, onSubmitRequest, onUpdateRequest, onDeleteRequest, coursesList, isSubmitting }) => {
            const [courseSelection, setCourseSelection] = useState("");
            const [customCourse, setCustomCourse] = useState("");
            // TODO 1 반영: 시간 기본값 1시간으로 변경
            const [usageTime, setUsageTime] = useState("1시간");
            const [name, setName] = useState("");
            const [carNumber, setCarNumber] = useState("");
            const [toast, setToast] = useState(null);

            // TODO 2 반영: 수정 모달 상태 관리
            const [editingReq, setEditingReq] = useState(null);
            const [editCourse, setEditCourse] = useState("");
            const [editUsageTime, setEditUsageTime] = useState("1시간");
            const [editName, setEditName] = useState("");
            const [editCarNumber, setEditCarNumber] = useState("");
            const [deletingReq, setDeletingReq] = useState(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const finalCourse = courseSelection === "직접입력" ? customCourse.trim() : courseSelection;

                if (!finalCourse || !usageTime || !name || !carNumber) {
                    setToast({ message: "모든 항목을 입력해주세요.", type: "error" });
                    return;
                }

                const success = await onSubmitRequest({ course: finalCourse, usageTime, name, carNumber });

                if (success) {
                    setCourseSelection("");
                    setCustomCourse("");
                    setUsageTime("1시간");
                    setName("");
                    setCarNumber("");
                    setToast({ message: "주차 등록이 완료되었습니다.", type: "success" });
                } else {
                    setToast({ message: "서버 연결에 실패했습니다. 다시 시도해주세요.", type: "error" });
                }
            };

            const openEditModal = (req) => {
                setEditingReq(req);
                setEditCourse(req.course);
                setEditUsageTime(req.usageTime);
                setEditName(req.name);
                setEditCarNumber(req.carNumber);
            };

            const handleUpdateSubmit = async (e) => {
                e.preventDefault();
                if (!editCourse || !editUsageTime || !editName || !editCarNumber) {
                    alert("모든 항목을 입력해주세요.");
                    return;
                }
                const success = await onUpdateRequest({
                    id: editingReq.id,
                    course: editCourse,
                    usageTime: editUsageTime,
                    name: editName,
                    carNumber: editCarNumber
                });
                if (success) {
                    setEditingReq(null);
                    setToast({ message: "접수 내역이 수정되었습니다.", type: "success" });
                }
            };

            const toggleFullscreen = () => {
                const docEl = document.documentElement;
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

                if (!isFullscreen) {
                    if (docEl.requestFullscreen) docEl.requestFullscreen();
                    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                    else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                }
            };

            const displayCourses = coursesList && coursesList.length > 0 ? coursesList : [
                "오디오 스튜디오", "스튜디오 대", "스튜디오 소", "1인 미디어실"
            ];

            return (
                <div className="flex flex-col md:flex-row gap-6 p-4 md:p-8 bg-gray-100 min-h-screen w-full box-border relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    <div className="flex-1 glass-effect rounded-2xl shadow-xl p-6 md:p-8 flex flex-col justify-start">
                        <div className="flex justify-between items-center mb-6">
                            <button onClick={toggleFullscreen} className="text-gray-400 hover:text-gray-600 p-2 rounded-lg bg-gray-100 hover:bg-gray-200 transition" title="전체화면 전환">
                                <i className="fas fa-expand text-xl"></i>
                            </button>
                            <img src="https://yimc.or.kr/theme/iwootec/img/logo2.png" alt="용인미디어센터 로고" className="h-10 object-contain" />
                        </div>

                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-extrabold text-gray-800 tracking-tight">용인미디어센터</h1>
                            <p className="text-lg text-gray-500 mt-2">주차 등록 신청 시스템</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-5 flex-1">
                            <div>
                                <label className="block text-gray-700 text-lg font-bold mb-2">대관 시설 및 강좌명</label>
                                <select
                                    value={courseSelection}
                                    onChange={(e) => {
                                        setCourseSelection(e.target.value);
                                        if (e.target.value !== "직접입력") setCustomCourse("");
                                    }}
                                    className="w-full text-lg p-4 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-blue-500 transition shadow-sm appearance-none bg-white font-medium"
                                >
                                    <option value="" disabled>이용하시는 시설을 선택해주세요</option>
                                    {displayCourses.map((c, idx) => (
                                        <option key={idx} value={c}>{c}</option>
                                    ))}
                                    <option value="직접입력" className="font-bold text-blue-600">기타 (직접 입력)</option>
                                </select>

                                {courseSelection === "직접입력" && (
                                    <div className="mt-3">
                                        <input
                                            type="text"
                                            placeholder="시설명, 강좌명 또는 행사명을 직접 입력해주세요"
                                            value={customCourse}
                                            onChange={(e) => setCustomCourse(e.target.value)}
                                            className="w-full text-lg p-4 border-2 border-blue-200 rounded-xl focus:ring-0 focus:border-blue-500 transition shadow-sm font-medium bg-blue-50"
                                            autoFocus
                                        />
                                    </div>
                                )}
                            </div>

                            <div>
                                <label className="block text-gray-700 text-lg font-bold mb-2">이용 시간</label>
                                <select
                                    value={usageTime}
                                    onChange={(e) => setUsageTime(e.target.value)}
                                    className="w-full text-lg p-4 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-blue-500 transition shadow-sm appearance-none bg-white font-medium"
                                >
                                    <option value="1시간">1시간</option>
                                    <option value="2시간">2시간</option>
                                    <option value="3시간">3시간</option>
                                    <option value="4시간">4시간</option>
                                    <option value="5시간">5시간</option>
                                    <option value="종일 (행사)">종일 (행사 등)</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-gray-700 text-lg font-bold mb-2">이름</label>
                                <input
                                    type="text"
                                    placeholder="예: 홍길동"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="w-full text-lg p-4 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-blue-500 transition shadow-sm font-medium"
                                />
                            </div>

                            <div>
                                <label className="block text-gray-700 text-lg font-bold mb-2">차량 번호</label>
                                <input
                                    type="text"
                                    placeholder="예: 12가 3456"
                                    value={carNumber}
                                    onChange={(e) => setCarNumber(e.target.value)}
                                    className="w-full text-lg p-4 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-blue-500 transition shadow-sm font-medium"
                                />
                            </div>

                            <div className="pt-4">
                                <button
                                    type="submit"
                                    disabled={isSubmitting}
                                    className={`w-full text-white font-bold text-2xl py-5 rounded-xl shadow-lg transform transition flex justify-center items-center gap-3 ${
                                        isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 active:scale-95'
                                    }`}
                                >
                                    {isSubmitting ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin"></i> 등록 중...
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-car"></i> 주차 등록 요청하기
                                        </>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>

                    <div className="w-full md:w-1/3 glass-effect rounded-2xl shadow-xl flex flex-col overflow-hidden h-auto md:h-[calc(100vh-4rem)]">
                        <div className="bg-slate-800 text-white p-5 text-center shadow-md z-10">
                            <h2 className="text-xl font-bold"><i className="fas fa-satellite-dish mr-2 animate-pulse"></i>실시간 접수 현황</h2>
                            <p className="text-xs text-slate-300 mt-1">대기중 건은 수정/취소가 가능합니다.</p>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 bg-slate-50 space-y-3">
                            {requests.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                    <i className="fas fa-clipboard-list text-5xl mb-4 opacity-50"></i>
                                    <p>오늘 접수된 내역이 없습니다.</p>
                                </div>
                            ) : (
                                [...requests].reverse().map((req) => (
                                    <div key={req.id} className={`p-4 rounded-xl shadow-sm border-l-4 flex justify-between items-center transition-all ${
                                        req.status === '대기중'
                                        ? 'bg-white border-yellow-400'
                                        : 'bg-green-50 border-green-500 opacity-80'
                                    }`}>
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="font-bold text-gray-800 text-lg">{maskCarNumber(req.carNumber)}</span>
                                                <span className="text-sm text-gray-500">({maskName(req.name)})</span>
                                            </div>
                                            <div className="text-xs text-gray-400 flex items-center gap-1">
                                                <i className="far fa-clock"></i> {formatTime(req.timestamp)} 접수
                                            </div>
                                        </div>

                                        <div className="flex flex-col items-end gap-1">
                                            {req.status === '대기중' ? (
                                                <>
                                                    <span className="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1 animate-pulse-slow">
                                                        <i className="fas fa-spinner fa-spin"></i> 대기중
                                                    </span>
                                                    {/* TODO 2 반영: 실시간 현황에서 수정/취소 버튼 */}
                                                    <div className="flex gap-1 mt-1">
                                                        <button
                                                            onClick={() => openEditModal(req)}
                                                            className="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700 font-medium"
                                                        >
                                                            수정
                                                        </button>
                                                        <button
                                                            onClick={() => setDeletingReq(req)}
                                                            className="text-xs bg-red-100 hover:bg-red-200 px-2 py-1 rounded text-red-600 font-medium"
                                                        >
                                                            취소
                                                        </button>
                                                    </div>
                                                </>
                                            ) : req.status === '인식안됨' ? (
                                                // ➕ 인식안됨 상태일 때 사용자에게 보여줄 뱃지
                                                <span className="bg-red-100 text-red-800 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1">
                                                    <i className="fas fa-exclamation-circle"></i> 인식안됨 (사무실 문의)
                                                </span>
                                            ): (
                                                <span className="bg-green-100 text-green-800 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1">
                                                    <i className="fas fa-check"></i> 처리완료
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* 수정 모달 팝업 */}
                    {editingReq && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <h3 className="text-xl font-bold text-gray-800 border-b pb-2">접수 내역 수정</h3>
                                <form onSubmit={handleUpdateSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">시설/강좌명</label>
                                        <input type="text" value={editCourse} onChange={(e)=>setEditCourse(e.target.value)} className="w-full p-3 border rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">이용 시간</label>
                                        <select value={editUsageTime} onChange={(e)=>setEditUsageTime(e.target.value)} className="w-full p-3 border rounded-lg">
                                            <option value="1시간">1시간</option>
                                            <option value="2시간">2시간</option>
                                            <option value="3시간">3시간</option>
                                            <option value="4시간">4시간</option>
                                            <option value="5시간">5시간</option>
                                            <option value="종일 (행사)">종일 (행사 등)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">이름</label>
                                        <input type="text" value={editName} onChange={(e)=>setEditName(e.target.value)} className="w-full p-3 border rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">차량 번호</label>
                                        <input type="text" value={editCarNumber} onChange={(e)=>setEditCarNumber(e.target.value)} className="w-full p-3 border rounded-lg" />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={()=>setEditingReq(null)} className="px-4 py-2 bg-gray-200 rounded-lg font-bold text-gray-600 hover:bg-gray-300">닫기</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 rounded-lg font-bold text-white hover:bg-blue-700">수정 저장</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    {deletingReq && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4 border border-gray-100">
                        <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto text-red-600 text-xl">
                            <i className="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>
                            <h3 className="text-lg font-bold text-gray-800">접수 취소 확인</h3>
                            <p className="text-sm text-gray-500 mt-2">
                                <strong className="text-gray-800 font-bold">{maskCarNumber(deletingReq.carNumber)}</strong> 차량의<br/>
                                주차 등록 신청을 취소하시겠습니까?
                            </p>
                        </div>
                        <div className="flex gap-2 pt-2">
                            <button
                                type="button"
                                onClick={() => setDeletingReq(null)}
                                className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold text-gray-600 transition"
                            >
                                닫기
                            </button>
                            <button
                                type="button"
                                onClick={async () => {
                                    await onDeleteRequest(deletingReq.id);
                                    setDeletingReq(null);
                                    setToast({ message: "접수가 취소되었습니다.", type: "error" });
                                }}
                                className="flex-1 py-3 bg-red-600 hover:bg-red-700 rounded-xl font-bold text-white shadow-md transition"
                            >
                                취소 확정
                            </button>
                        </div>
                    </div>
                </div>
            )}
                </div>
            );
        };

        // --- 관리자 PC 뷰 컴포넌트 ---
        const AdminView = ({ requests, onCompleteRequest, onDeleteRequest, onUnrecognizedRequest,coursesList, onSaveSettings, currentTabletPassword, currentAdminPassword, isSyncing,onTabChange }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [newCourse, setNewCourse] = useState("");
            const [tempCourses, setTempCourses] = useState([...coursesList]);
            // TODO 3 & 4 반영: 사용자(태블릿) 암호, 관리자 암호 분리 설정
            const [tempTabletPassword, setTempTabletPassword] = useState(currentTabletPassword);
            const [tempAdminPassword, setTempAdminPassword] = useState(currentAdminPassword);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                if (activeTab === 'settings') return;
                setTempCourses([...coursesList]);
                setTempTabletPassword(currentTabletPassword);
                setTempAdminPassword(currentAdminPassword);
            }, [coursesList, currentTabletPassword, currentAdminPassword]);

            const handleAddCourse = () => {
                if (newCourse.trim() && !tempCourses.includes(newCourse.trim())) {
                    setTempCourses([...tempCourses, newCourse.trim()]);
                    setNewCourse("");
                }
            };

            const handleRemoveCourse = (course) => {
                setTempCourses(tempCourses.filter(c => c !== course));
            };

            const handleSaveSettings = async () => {
                const success = await onSaveSettings(tempCourses, tempTabletPassword, tempAdminPassword);
                if (success) {
                    setToast({ message: "설정이 구글 시트에 저장되었습니다.", type: "success" });
                } else {
                    setToast({ message: "설정 저장에 실패했습니다.", type: "error" });
                }
            };
            const handleTabClick = (tabName) => {
                setActiveTab(tabName);
                if (onTabChange) onTabChange(tabName === 'settings'); // 설정 탭이면 true 전달
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    <nav className="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 relative">
                        <div className="flex items-center gap-3">
                            <img src="https://yimc.or.kr/theme/iwootec/img/logo2.png" alt="용인미디어센터 로고" className="h-8 object-contain" />
                            <div className="h-5 w-px bg-slate-300 mx-2"></div>
                            <h1 className="text-xl font-bold text-slate-800">관리자 대시보드</h1>
                            {isSyncing && <span className="text-xs text-blue-500 animate-pulse bg-blue-50 px-2 py-0.5 rounded ml-2"><i className="fas fa-sync fa-spin"></i> 구글 동기화 중</span>}
                        </div>

                        <div className="flex gap-2">
                            <button
                                onClick={() => handleTabClick('dashboard')}
                                className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                <i className="fas fa-list-ul mr-2"></i>주차 현황
                            </button>
                            <button
                                onClick={() => handleTabClick('settings')}
                                className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'settings' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                <i className="fas fa-cog mr-2"></i>시스템 설정
                            </button>
                        </div>
                    </nav>

                    <div className="flex-1 p-6 md:p-8 max-w-7xl mx-auto w-full">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800 mb-1">오늘의 접수 현황</h2>
                                        <p className="text-slate-500">구글 클라우드 시트와 실시간 연동 중입니다.</p>
                                    </div>
                                    <button onClick={playNotificationSound} className="text-sm text-blue-600 bg-blue-50 px-3 py-1 rounded-full hover:bg-blue-100 transition border border-blue-200">
                                        <i className="fas fa-volume-up mr-1"></i> 소리 테스트
                                    </button>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm uppercase tracking-wider">
                                                    <th className="p-4 font-semibold">요청 시간</th>
                                                    <th className="p-4 font-semibold">대관 시설/강좌</th>
                                                    <th className="p-4 font-semibold">이용 시간</th>
                                                    <th className="p-4 font-semibold">이름</th>
                                                    <th className="p-4 font-semibold">차량 번호</th>
                                                    <th className="p-4 font-semibold">상태</th>
                                                    <th className="p-4 font-semibold text-center">관리</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {requests.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="p-8 text-center text-slate-400">
                                                            접수된 주차 요청이 없습니다.
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    [...requests].reverse().map((req) => (
                                                        <tr key={req.id} className="hover:bg-slate-50 transition">
                                                            <td className="p-4 text-slate-600">
                                                                <div className="text-sm">{formatDate(req.timestamp)}</div>
                                                                <div className="font-semibold text-slate-800">{formatTime(req.timestamp)}</div>
                                                            </td>
                                                            <td className="p-4">
                                                                <span className="bg-gray-100 text-gray-700 px-2 py-1 rounded text-sm">{req.course}</span>
                                                            </td>
                                                            <td className="p-4 text-slate-700">{req.usageTime}</td>
                                                            <td className="p-4 font-medium text-slate-800">{req.name}</td>
                                                            <td className="p-4 font-bold text-blue-900 tracking-wide text-lg">{req.carNumber}</td>
                                                            <td className="p-4">
                                                                {req.status === '대기중' ? (
                                                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800 border border-yellow-200">
                                                                        <span className="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                                                                        대기중
                                                                    </span>
                                                                ) : req.status === '인식안됨' ? (
        // ➕ 인식안됨 상태 뱃지 추가
        <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800 border border-red-200">
            <i className="fas fa-exclamation-triangle text-red-600"></i>인식안됨
        </span>
    ):(
                                                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 border border-green-200">
                                                                        <i className="fas fa-check text-green-600"></i>
                                                                        완료
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td className="p-4 text-center space-x-2">
                                                                {req.status === '대기중' && (
                                                                    <><button
                                                                        onClick={() => onCompleteRequest(req.id)}
                                                                        className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm"
                                                                    >
                                                                        등록완료
                                                                    </button>
                                                                    <button
                                                                        onClick={() => {
                                                                            if(window.confirm('이 차량을 인식안됨 처리하시겠습니까?')) {
                                                                                onUnrecognizedRequest(req.id);
                                                                            }
                                                                        }}
                                                                        className="bg-orange-500 hover:bg-orange-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow-sm"
                                                                    >
                                                                        인식불가
                                                                    </button>
                                                                    </>
                                                                )}
                                                                <button
                                                                    onClick={() => {
                                                                        if(window.confirm('정말 이 기록을 구글 시트에서 삭제하시겠습니까?')) {
                                                                            onDeleteRequest(req.id);
                                                                        }
                                                                    }}
                                                                    className="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 px-3 py-2 rounded-lg text-sm transition"
                                                                    title="기록 삭제"
                                                                >
                                                                    <i className="far fa-trash-alt"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 border-b pb-4 mb-4 flex items-center gap-2">
                                        <i className="fas fa-lock text-slate-400"></i> 보안 및 비밀번호 설정
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-2">안내데스크 태블릿 잠금 비밀번호</label>
                                            <input
                                                type="text"
                                                value={tempTabletPassword}
                                                onChange={(e) => setTempTabletPassword(e.target.value)}
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                                placeholder="예: 0000"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-2">관리자 PC 접속 비밀번호</label>
                                            <input
                                                type="text"
                                                value={tempAdminPassword}
                                                onChange={(e) => setTempAdminPassword(e.target.value)}
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                                placeholder="예: 1234"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 border-b pb-4 mb-4 flex items-center gap-2">
                                        <i className="fas fa-building text-slate-400"></i> 대관 시설 및 강좌 목록 관리
                                    </h3>

                                    <div className="flex gap-2 mb-4">
                                        <input
                                            type="text"
                                            value={newCourse}
                                            onChange={(e) => setNewCourse(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleAddCourse()}
                                            placeholder="새로운 시설명 또는 강좌명 입력"
                                            className="flex-1 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        />
                                        <button
                                            onClick={handleAddCourse}
                                            className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2 rounded-lg font-medium transition"
                                        >
                                            추가
                                        </button>
                                    </div>

                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 min-h-[150px]">
                                        {tempCourses.length === 0 ? (
                                            <p className="text-center text-slate-400 py-4">등록된 목록이 없습니다.</p>
                                        ) : (
                                            <div className="flex flex-wrap gap-2">
                                                {tempCourses.map((course, idx) => (
                                                    <span key={idx} className="bg-white border border-slate-300 text-slate-700 px-3 py-1.5 rounded-full text-sm flex items-center gap-2 shadow-sm">
                                                        {course}
                                                        <button onClick={() => handleRemoveCourse(course)} className="text-slate-400 hover:text-red-500">
                                                            <i className="fas fa-times"></i>
                                                        </button>
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="flex justify-end pt-4">
                                    <button onClick={handleSaveSettings} className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">
                                        설정 저장하기
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 메인 앱 컴포넌트 ---
        const App = () => {
            const [viewMode, setViewMode] = useState('select');
            const [isLocked, setIsLocked] = useState(true);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [inputPassword, setInputPassword] = useState("");

            const [requests, setRequests] = useState([]);
            const [settings, setSettings] = useState({
                courses: ["오디오 스튜디오", "스튜디오 대", "스튜디오 소", "1인 미디어실"],
                tabletPassword: "0000",
                adminPassword: "1234"
            });
            const [prevRequestsCount, setPrevRequestsCount] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const sendPostRequest = async (payload) => {
                if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("입력하세요")) {
                    console.warn("구글 웹 앱 URL이 채워지지 않았습니다.");
                    return null;
                }
                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    return await response.json();
                } catch (error) {
                    console.error("구글 시트 연동 중 에러 발생:", error);
                    return null;
                }
            };

            const fetchCloudData = async () => {
                if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("입력하세요")) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getData`);
                    const data = await response.json();
                    if (data) {
                        if (data.requests) setRequests(data.requests);
                        if (data.settings) setSettings(data.settings);
                    }
                } catch (error) {
                    console.error("구글 시트 로딩 실패:", error);
                } finally {
                    setIsSyncing(false);
                }
            };

            useEffect(() => {
                if (isSettingsOpen) return;

                fetchCloudData();
                if (isSettingsOpen) return;
                const interval = setInterval(fetchCloudData, 5000);
                return () => clearInterval(interval);
            }, [viewMode]);

            useEffect(() => {
                if (viewMode === 'pc') {
                    const currentPending = requests.filter(r => r.status === '대기중').length;
                    if (currentPending > prevRequestsCount) {
                        playNotificationSound();
                    }
                    setPrevRequestsCount(currentPending);
                }
            }, [requests, viewMode]);

            const addRequest = async (data) => {
                setIsSubmitting(true);
                const payload = { action: 'add', ...data };
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if (res && res.success) {
                    await fetchCloudData();
                    return true;
                }
                return false;
            };

            const updateRequest = async (data) => {
                const res = await sendPostRequest({ action: 'update', ...data });
                if (res && res.success) {
                    await fetchCloudData();
                    return true;
                }
                return false;
            };

            const completeRequest = async (id) => {
                const res = await sendPostRequest({ action: 'complete', id });
                if (res && res.success) await fetchCloudData();
            };

            const markUnrecognizedRequest = async (id) => {
    const res = await sendPostRequest({ action: 'unrecognized', id });
    if (res && res.success) await fetchCloudData();
};

            const deleteRequest = async (id) => {
                const res = await sendPostRequest({ action: 'delete', id });
                if (res && res.success) await fetchCloudData();
            };

            const saveSettings = async (courses, tPwd, aPwd) => {
                const res = await sendPostRequest({
                    action: 'saveSettings',
                    courses,
                    tabletPassword: tPwd,
                    adminPassword: aPwd
                });
                if (res && res.success) {
                    await fetchCloudData();
                    return true;
                }
                return false;
            };

            const handleUnlock = (e) => {
                e.preventDefault();
                const targetPwd = viewMode === 'tablet' ? settings.tabletPassword : settings.adminPassword;
                if (inputPassword === targetPwd) {
                    setIsLocked(false);
                    setInputPassword("");
                } else {
                    alert("비밀번호가 틀렸습니다.");
                    setInputPassword("");
                }
            };

            if (viewMode === 'select') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-900 to-slate-800 flex items-center justify-center p-4">
                        <div className="glass-effect rounded-3xl p-10 max-w-2xl w-full text-center shadow-2xl">
                            <div className="mb-10 flex flex-col items-center">
                                <img src="https://yimc.or.kr/theme/iwootec/img/logo2.png" alt="용인미디어센터 로고" className="h-16 object-contain mb-5" />
                                <h1 className="text-3xl font-extrabold text-slate-800 mb-2">주차 관리 시스템</h1>
                                <p className="text-slate-500">실행할 기기의 환경을 선택해주세요 (구글 시트 연동 버전).</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <button
                                    onClick={() => { setViewMode('tablet'); setIsLocked(true); }}
                                    className="flex flex-col items-center justify-center p-8 border-2 border-slate-200 bg-white rounded-2xl hover:border-blue-500 hover:shadow-lg transition group"
                                >
                                    <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4 group-hover:bg-blue-50 transition">
                                        <i className="fas fa-tablet-alt text-4xl text-slate-500 group-hover:text-blue-600"></i>
                                    </div>
                                    <h2 className="text-xl font-bold text-slate-800">안내데스크 태블릿</h2>
                                    <p className="text-sm text-slate-500 mt-2">방문자 직접 입력용</p>
                                </button>

                                <button
                                    onClick={() => {
                                        setViewMode('pc');
                                        setIsLocked(true);
                                        try {
                                            const AudioContext = window.AudioContext || window.webkitAudioContext;
                                            audioCtx = new AudioContext();
                                            if(audioCtx.state === 'suspended') audioCtx.resume();
                                        } catch(e) {}
                                    }}
                                    className="flex flex-col items-center justify-center p-8 border-2 border-slate-200 bg-white rounded-2xl hover:border-blue-500 hover:shadow-lg transition group"
                                >
                                    <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4 group-hover:bg-blue-50 transition">
                                        <i className="fas fa-desktop text-4xl text-slate-500 group-hover:text-blue-600"></i>
                                    </div>
                                    <h2 className="text-xl font-bold text-slate-800">사무실 관리자 PC</h2>
                                    <p className="text-sm text-slate-500 mt-2">현황 확인 및 승인 처리</p>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (isLocked) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center">
                            <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i className="fas fa-lock text-2xl text-blue-600"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">
                                {viewMode === 'tablet' ? '태블릿 잠금 해제' : '관리자 PC 로그인'}
                            </h2>
                            <p className="text-slate-500 text-sm mb-6">
                                {viewMode === 'tablet'
                                    ? '태블릿 모드를 실행하려면 비밀번호를 입력하세요.'
                                    : '관리자 권한 인증을 위해 비밀번호를 입력하세요.'}
                            </p>

                            <form onSubmit={handleUnlock}>
                                <input
                                    type="password"
                                    value={inputPassword}
                                    onChange={(e) => setInputPassword(e.target.value)}
                                    placeholder="비밀번호 입력"
                                    className="w-full text-center text-xl p-4 border border-slate-300 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none tracking-widest font-mono"
                                    autoFocus
                                />
                                <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl transition shadow-md">
                                    접속하기
                                </button>
                            </form>
                            <button onClick={() => setViewMode('select')} className="mt-4 text-sm text-slate-400 hover:text-slate-600 underline">처음으로 돌아가기</button>
                        </div>
                    </div>
                );
            }

            if (viewMode === 'tablet') {
                return (
                    <div className="relative">
                        <TabletView
                            requests={requests}
                            onSubmitRequest={addRequest}
                            onUpdateRequest={updateRequest}
                            onDeleteRequest={deleteRequest}
                            coursesList={settings.courses}
                            isSubmitting={isSubmitting}
                        />
                        <button onClick={() => { setIsLocked(true); setViewMode('select'); }} className="absolute top-2 right-2 w-8 h-8 opacity-10 hover:opacity-100 transition">
                            <i className="fas fa-home text-slate-400"></i>
                        </button>
                    </div>
                );
            }

            if (viewMode === 'pc') {
                return (
                    <div className="relative">
                        <AdminView
                            requests={requests}
                            onCompleteRequest={completeRequest}
                            onDeleteRequest={deleteRequest}
                            onUnrecognizedRequest={markUnrecognizedRequest}
                            coursesList={settings.courses}
                            currentTabletPassword={settings.tabletPassword}
                            currentAdminPassword={settings.adminPassword}
                            onSaveSettings={saveSettings}
                            isSyncing={isSyncing}
                            onTabChange={(isOpen) => setIsSettingsOpen(isOpen)}
                        />
                        <button onClick={() => { setIsLocked(true); setViewMode('select'); }} className="fixed bottom-4 right-4 bg-slate-800 text-white w-12 h-12 rounded-full shadow-xl hover:bg-slate-700 flex items-center justify-center transition opacity-50 hover:opacity-100 z-50" title="초기 선택화면으로">
                            <i className="fas fa-home"></i>
                        </button>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
